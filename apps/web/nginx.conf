server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Hashed build files never change: the browser can keep them for a year.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # The shell and the service worker must always be revalidated, or users stay on an old version.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }
    location = /sw.js {
        add_header Cache-Control "no-cache";
    }

    # Other static files (logo, icons): a day, then revalidate.
    location ~* \.(png|jpg|jpeg|webp|avif|svg|ico|woff2)$ {
        add_header Cache-Control "public, max-age=86400";
        try_files $uri =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    gzip on;
    gzip_vary on;
    gzip_comp_level 6;
    gzip_proxied any;
    gzip_types text/plain text/css text/xml application/javascript application/json application/manifest+json image/svg+xml;
    gzip_min_length 1024;
}
