<svg width="512" height="512" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- Background gradient -->
  <defs>
    <linearGradient id="gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#F43F5E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#EC4899;stop-opacity:1" />
    </linearGradient>
  </defs>

  <!-- Rounded background -->
  <rect width="512" height="512" rx="115" fill="url(#gradient)"/>

  <!-- Wallet shape -->
  <g transform="translate(85, 115)">
    <!-- Main wallet body -->
    <rect x="0" y="50" width="340" height="230" rx="25" fill="white" opacity="0.95"/>

    <!-- Wallet flap/top -->
    <path d="M 25 50 L 315 50 L 340 25 Q 340 0 315 0 L 25 0 Q 0 0 0 25 Z" fill="white" opacity="0.85"/>

    <!-- Card slot indicator -->
    <rect x="30" y="85" width="120" height="15" rx="7" fill="#F43F5E" opacity="0.3"/>

    <!-- Wallet pocket/fold line -->
    <line x1="0" y1="150" x2="340" y2="150" stroke="#F43F5E" stroke-width="3" opacity="0.2"/>

    <!-- Money/card peek -->
    <rect x="280" y="160" width="45" height="70" rx="5" fill="#10B981" opacity="0.7"/>
    <rect x="265" y="165" width="45" height="70" rx="5" fill="#FBBF24" opacity="0.7"/>
    <rect x="250" y="170" width="45" height="70" rx="5" fill="#3B82F6" opacity="0.7"/>

    <!-- Dollar sign -->
    <text x="90" y="200" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="#F43F5E" opacity="0.6">$</text>
  </g>
</svg>
